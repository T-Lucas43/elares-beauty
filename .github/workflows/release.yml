name: Validar aplicação
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: beauty
          POSTGRES_USER: beauty
          POSTGRES_PASSWORD: beauty_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://beauty:beauty_ci_only@localhost:5432/beauty
      APP_URL: http://127.0.0.1:3018
      BETTER_AUTH_URL: http://127.0.0.1:3018
      APP_ORIGINS: http://127.0.0.1:3018
      BETTER_AUTH_SECRET: ci-only-build-secret-not-used-in-production-2026
      INITIAL_LOCAL_PASSWORD: demo-local-2026
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      WHATSAPP_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:seed
      - name: Validar tipos e fluxos
        run: |
          npm run dev > /tmp/beauty.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3018/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/beauty.log; exit 1; fi
          npm run typecheck
          npm test
      - run: npm run build
      - name: Preparar pacote Linux para Shard
        run: |
          RELEASE_SHA="$GITHUB_SHA" node scripts/package-release.mjs --shard-node
          python - <<'PY'
          import os
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          root=Path('release-package')
          with ZipFile('elares-beauty-linux.zip','w',ZIP_DEFLATED) as archive:
              for folder,dirs,files in os.walk(root,followlinks=True):
                  for name in files:
                      path=Path(folder)/name
                      archive.write(path,path.relative_to(root))
          PY
          python scripts/package-shard-node.py elares-beauty-linux.zip elares-beauty-node.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: elares-beauty-shard
          path: elares-beauty-node.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
