name: elares-beauty
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: ${BEAUTY_DB_PASSWORD:?Configure BEAUTY_DB_PASSWORD}
      POSTGRES_DB: elares_beauty
    ports:
      - "127.0.0.1:5548:5432"
    volumes:
      - beauty_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty -d elares_beauty"]
      interval: 3s
      retries: 15
volumes:
  beauty_data:
    name: elares_beauty_data
